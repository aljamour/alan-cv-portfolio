name: Portfolio CI

on:
  push:
    branches:
      - newmain

  pull_request:
    branches:
      - newmain

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required files
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s translations.js
          test -d assets

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check script.js
          node --check translations.js

      - name: Check local HTML references
        shell: bash
        run: |
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          repository = Path.cwd()
          missing = []

          class ReferenceParser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  for attribute in ("src", "href"):
                      reference = attributes.get(attribute)

                      if not reference:
                          continue

                      if reference.startswith((
                          "http://",
                          "https://",
                          "mailto:",
                          "tel:",
                          "#",
                          "data:",
                          "javascript:"
                      )):
                          continue

                      parsed = urlparse(reference)
                      path = unquote(parsed.path).lstrip("/")

                      if not path:
                          continue

                      target = repository / path

                      if not target.exists():
                          missing.append(
                              f"{tag}[{attribute}] -> {reference}"
                          )

          parser = ReferenceParser()
          parser.feed(
              (repository / "index.html").read_text(encoding="utf-8")
          )

          if missing:
              print("Missing local files:")

              for reference in missing:
                  print(f" - {reference}")

              raise SystemExit(1)

          print("All local HTML references exist.")
          PY
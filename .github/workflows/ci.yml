name: Portfolio CI

on:
  push:
    branches:
      - newmain

  pull_request:
    branches:
      - newmain

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required files
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s translations.js
          test -d assets

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check script.js
          node --check translations.js

      - name: Check local HTML references
        shell: bash
        run: |
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          repository = Path.cwd()
          missing = []

          class ReferenceParser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  for attribute in ("src", "href"):
                      reference = attributes.get(attribute)

                      if not reference:
                          continue

                      if reference.startswith((
                          "http://",
                          "https://",
                          "mailto:",
                          "tel:",
                          "#",
                          "data:",
                          "javascript:"
                      )):
                          continue

                      parsed = urlparse(reference)
                      path = unquote(parsed.path).lstrip("/")

                      if not path:
                          continue

                      target = repository / path

                      if not target.exists():
                          missing.append(
                              f"{tag}[{attribute}] -> {reference}"
                          )

          parser = ReferenceParser()
          parser.feed(
              (repository / "index.html").read_text(encoding="utf-8")
          )

          if missing:
              print("Missing local files:")

              for reference in missing:
                  print(f" - {reference}")

              raise SystemExit(1)

          print("All local HTML references exist.")
          PY

  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: validate

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/newmain'

    timeout-minutes: 10

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify server access
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'test -w /var/www/alan-cv-portfolio && command -v rsync'

      - name: Deploy static website
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/alan-cv-portfolio/"

      - name: Verify live website
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            https://aljamour.dk/ \
            > /dev/null

      - name: Remove deployment key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key